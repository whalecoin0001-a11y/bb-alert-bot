name: BB Alert Check

on:
  schedule:
    # 정각 기준 딱 떨어지는 시간(0,5,10...)은 전 세계 워크플로우가 몰려서 GitHub가
    # 지연시키거나 건너뛰는 경우가 흔하다. 2분 오프셋을 줘서 혼잡을 피한다.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bb-alert-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_bb.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "bb-alert-bot"
          git config user.email "bb-alert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          # 백업 크론(bb-alert-cron 토큰)과 GitHub 자체 스케줄이 초 단위로 겹치면
          # 서로 push를 가로챌 수 있다. data/*.json은 그때그때 계산된 스냅샷이라
          # 병합할 의미가 없으므로, 실패 시 원격 최신 위에 우리 데이터로 다시
          # 커밋해서 재시도한다(rebase 충돌 없이 항상 우리 값으로 덮어씀).
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 실패(다른 실행과 충돌), 재시도 $i/5…"
            sleep 3
            git fetch origin main
            git reset --soft origin/main
            git add data/
            git diff --cached --quiet || git commit -m "state update [skip ci]"
          done
          git push

      # 위 단계 중 어디서든 실패하면(의존성 설치 실패, check_bb.py 자체가 못 뜨는
      # 경우 등) 여기서 텔레그램으로 알린다. check_bb.py 내부 오류는 이미 그
      # 안에서 send_error_once로 알리지만, 그 코드가 아예 실행되지 못하는
      # 상황은 여기서만 잡을 수 있다. 같은 dedup 상태 파일을 재사용해서
      # 반복 실패 시 스팸이 되지 않게 한다.
      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install requests --quiet
          python notify_failure.py
          git config user.name "bb-alert-bot"
          git config user.email "bb-alert-bot@users.noreply.github.com"
          git add data/error_alert_state.json
          git diff --cached --quiet || git commit -m "error state update [skip ci]"
          git push || true
