name: BB Alert Check

on:
  # GitHub 자체 schedule 트리거는 신생 저장소에서 5분 간격을 못 지키고(실측 30분+
  # 간격) 신뢰할 수 없어서 뺐다. 대신 cron-job.org가 5분마다 workflow_dispatch를
  # 직접 호출한다. schedule을 같이 켜두면 가끔 두 트리거가 겹쳐서 실행이 충돌·
  # 취소되는 경우가 실제로 있었다(2026-08-26 15:25 UTC 실행 참고).
  workflow_dispatch:

concurrency:
  group: bb-alert-check
  # 백업 크론과 GitHub 자체 스케줄이 몇십 초 차이로 겹치면 큐잉이 완벽히 막아주지
  # 못하는 경우가 있었다(실제로 두 실행이 동시에 돌아 중복 알림이 나감). 새 실행이
  # 들어오면 먼저 돌던 걸 바로 취소해서, 알림을 보내기 전(체크 로직 완료 전) 단계에서
  # 겹침을 끊어낼 확률을 높인다.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_bb.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "bb-alert-bot"
          git config user.email "bb-alert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          # 백업 크론(bb-alert-cron 토큰)과 GitHub 자체 스케줄이 초 단위로 겹치면
          # 서로 push를 가로챌 수 있다. 대부분의 data/*.json은 그때그때 계산된
          # 스냅샷이라 덮어써도 무방하지만, touch_alert_state.json/new_mark_state.json
          # (종목×구간 → "오늘 이미 처리함" 기록)은 그냥 덮어쓰면 상대방이 방금
          # 기록한 항목을 지워버려 나중에 중복 알림으로 이어진다 — merge_state.py로
          # 원격과 병합(합집합 + 최신 라벨 우선)한 뒤 재시도한다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 실패(다른 실행과 충돌), 재시도 $i/5…"
            sleep 3
            git fetch origin main
            python merge_state.py
            # --soft는 인덱스를 갱신하지 않아, 이 실행의 체크아웃이 원격보다
            # 뒤처진 코드 커밋을 물고 있었다면 그 스냅샷 그대로 재커밋되어
            # 방금 배포된 코드 변경을 되돌려버리는 사고가 실제로 있었다.
            # (기본값인) --mixed로 인덱스까지 원격에 맞춰 동기화한 뒤,
            # data/만 다시 add해서 코드 파일은 원격 그대로 유지되게 한다.
            git reset origin/main
            git add data/
            git diff --cached --quiet || git commit -m "state update [skip ci]"
          done
          git push

      # 위 단계 중 어디서든 실패하면(의존성 설치 실패, check_bb.py 자체가 못 뜨는
      # 경우 등) 여기서 텔레그램으로 알린다. check_bb.py 내부 오류는 이미 그
      # 안에서 send_error_once로 알리지만, 그 코드가 아예 실행되지 못하는
      # 상황은 여기서만 잡을 수 있다. 같은 dedup 상태 파일을 재사용해서
      # 반복 실패 시 스팸이 되지 않게 한다.
      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install requests --quiet
          python notify_failure.py
          git config user.name "bb-alert-bot"
          git config user.email "bb-alert-bot@users.noreply.github.com"
          git add data/error_alert_state.json
          git diff --cached --quiet || git commit -m "error state update [skip ci]"
          git push || true
